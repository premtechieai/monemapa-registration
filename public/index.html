<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8839ef">
  <title>MoneMapa · Create your account</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap">

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="page">
    <div class="frame">
      <header class="app-header">
        <a class="brand" href="/" aria-label="MoneMapa home">
          <span class="brand__mark" aria-hidden="true">M</span>
          <span class="brand__name">Mone<span>Mapa</span></span>
        </a>
        <div class="app-header__badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="18" height="11" x="3" y="11"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span class="app-header__badge-text">Passwordless &amp; encrypted</span>
        </div>
      </header>

      <div class="frame__body">
        <!-- Desktop / tablet: step sidebar. Filled by js/components/stepper.js -->
        <aside class="steps-aside" id="steps-aside" aria-label="Progress"></aside>

        <!-- Mobile: compact progress bar. Filled by js/components/stepper.js -->
        <div class="steps-progress" id="steps-progress"></div>

        <main class="main" id="main">
          <div class="main__inner" id="view" aria-live="polite">
            <noscript>This app needs JavaScript enabled.</noscript>
          </div>
        </main>
      </div>
    </div>
  </div>
</body>
</html>
